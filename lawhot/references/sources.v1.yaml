# 入库过滤提示词/规则（给中台用，不是最终 prompt）
ingest_rules:
  include_any:
    - AI Act|artificial intelligence act|生成式人工智能|深度合成|深度伪造
    - legaltech|legal tech|法律科技|智慧法院|法律大模型
    - copyright|copyright lawsuit|训练数据|著作权|知识产权
    - liability|malpractice|hallucination.*court|AI.*判决|AI.*证据
    - privacy|GDPR|个人信息|数据出境|合规
    - eDiscovery|contract review|合同审查|尽调|legal agent
  exclude_any:
    - 招聘|求职|广告|优惠|课程推广|免费领取
    - customer story|客户案例|success story
  vendor_frontier_extra:
    keep_if_any:
      - safety|alignment|policy|security|evaluation|responsible|governance|经济影响|安全|对齐|治理|监管
    drop_if_only:
      - pricing|launch party|hiring|merch

