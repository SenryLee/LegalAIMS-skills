# LawHOT 信源注册表 v0.2
# 用途：内容中台抓取配置的人工底稿；字段可直接映射为 DB seed。
# 原则：中英大致各半；头部模型厂商研究/政策文为重点；先 P0 再扩。
# 硬约束：不接入付费墙/订阅库（Law.com Legaltech News、Bloomberg Law、Law360、
#         The Information、SemiAnalysis 付费层等）；公开网页/RSS/官方 PDF 可进。
# status.reachability：存量多为 2026-07-25 探测；v0.2 新增源默认 pending_probe。

version: "0.2"
updated: "2026-07-28"
product: lawhot
changelog:
  - "v0.2：扩 OpenAI/Anthropic 研究子频道；补 NIST/EU AI Office/UK AISI/版权局；"
  - "      Legaltech Hub、Import AI、Daily Papers；中文法研/智合等；明确排除付费源。"

tracks:
  - id: law_x_ai
    name: 监管与案件（Law × AI）
  - id: ai_x_law
    name: 行业启迪与落地（AI × Law）
  - id: vendor_frontier
    name: 头部厂商研究/安全/政策（影响法律行业的一手信号）

tiers:
  P0: MVP 首批必接（建议 2 周内接通）
  P1: 第二批（稳定后扩）
  P2: 观察池（有价值但噪声大/抓取难/专题用）

channels:
  - rss
  - web
  - wechat
  - x
  - api
  - newsletter

policy:
  no_paywall: true
  excluded_examples:
    - Law.com Legaltech News（付费墙）
    - Bloomberg Law
    - Law360
    - The Information
    - SemiAnalysis 付费层
    - Lexis/Westlaw 全文库
  vendor_filter: 入库过滤纯营销/客户案例；研究·安全·政策·System Card 加权
  general_ai_filter: 通用 AI 源强过滤，只收影响法律/监管/版权/责任/就业/安全的信号
  aihot_note: >
    通用 AI 日更可复用 aihot 聚合层（aihot.virxact.com）做候选池，
    LawHOT 侧重法律向一手源与策展，避免重复全量抓取。

