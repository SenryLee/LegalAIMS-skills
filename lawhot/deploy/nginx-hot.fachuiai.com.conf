# 安装到：/etc/nginx/sites-available/hot.fachuiai.com
# 启用：ln -sf ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 证书：certbot --nginx -d hot.fachuiai.com

server {
    listen 80;
    listen [::]:80;
    server_name hot.fachuiai.com;

    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /lawhot-skill/ {
        alias /opt/lawhot/lawhot-skill/;
        autoindex on;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
