# 入库过滤提示词/规则（给中台用，不是最终 prompt）
ingest_rules:
  include_any:
    - AI Act|artificial intelligence act|生成式人工智能|深度合成|深度伪造
    - legaltech|legal tech|法律科技|智慧法院|法律大模型
    - copyright|copyright lawsuit|训练数据|著作权|知识产权
    - liability|malpractice|hallucination.*court|AI.*判决|AI.*证据
    - privacy|GDPR|个人信息|数据出境|合规
    - eDiscovery|contract review|合同审查|尽调|legal agent
    - system card|preparedness|model spec|alignment|economic index
    - NIST AI RMF|AI Office|AISI|Copyright Office
  exclude_any:
    - 招聘|求职|广告|优惠|课程推广|免费领取
    - customer story|客户案例|success story
    - paywall|subscriber only|members only
  vendor_frontier_extra:
    keep_if_any:
      - safety|alignment|policy|security|evaluation|responsible|governance|经济影响|安全|对齐|治理|监管|system card|model card|preparedness
    drop_if_only:
      - pricing|launch party|hiring|merch|success story

seed_counts:
  version: "0.2"
  total_sources_approx: 110
  p0_approx: 55
  p1_approx: 40
  p2_approx: 15
  note: >
    中英按 P0 计接近各半；OpenAI/Anthropic 子频道加权不计入「冲淡法律垂直」的噪声配额。
    明确排除付费墙源；通用 AI 可与 aihot 互补。
