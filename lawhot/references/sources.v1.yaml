# LawHOT 信源注册表 v0.1
# 用途：内容中台抓取配置的人工底稿；字段可直接映射为 DB seed。
# 原则：中英大致各半；头部模型厂商研究/政策文为重点；先 P0 再扩。
# status.reachability 为 2026-07-25 探测结果，落地前需再验一次。

version: "0.1"
updated: "2026-07-25"
product: lawhot
tracks:
  - id: law_x_ai
    name: 监管与案件（Law × AI）
  - id: ai_x_law
    name: 行业启迪与落地（AI × Law）
  - id: vendor_frontier
    name: 头部厂商研究/安全/政策（影响法律行业的一手信号）

tiers:
  P0: MVP 首批必接（建议 2 周内接通）
  P1: 第二批（稳定后扩）
  P2: 观察池（有价值但噪声大/权限重/抓取难）

channels:
  - rss
  - web
  - wechat
  - x
  - api
  - newsletter

